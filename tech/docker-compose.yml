services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "2181" ]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 5s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        kafka-topics \
          --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic ddos-raw \
          --partitions 4 \
          --replication-factor 1

  kafka-producer:
    image: python:3.11-slim
    container_name: kafka-producer
    working_dir: /opt/pipeline
    command: >
      sh -c "pip install kafka-python --quiet &&
             python sources/producer.py"
    volumes:
      - ..:/opt/pipeline
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure



  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:///./prefect.db
    volumes:
      - prefect-data:/root/.prefect
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ..:/opt/pipeline
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.3
    container_name: spark-worker
    user: root
    entrypoint:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 4g
      SPARK_WORKER_CORES: 2
    ports:
      - "8081:8081"
    volumes:
      - ..:/opt/pipeline
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081" ]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  pipeline-runner:
    image: apache/spark:3.5.3
    container_name: pipeline-runner
    user: root
    working_dir: /opt/pipeline
    entrypoint: [ "/bin/bash", "-c" ]
    command: >-
      "pip install prefect==2.20.25 pyspark==3.5.3 kafka-python==2.0.2 pyyaml --quiet --no-cache-dir &&
       python3 schedule/ddos_dag.py"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ddos-raw
      PYSPARK_PYTHON: python3
      HOME: /root
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    mem_limit: 3g
    volumes:
      - ..:/opt/pipeline
    depends_on:
      spark-worker:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: on-failure

volumes:
  prefect-data: